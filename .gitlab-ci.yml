stages:
  - test_lint_build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"
  PYTHON_VERSION: "3.13"
  FF_NETWORK_PER_BUILD: 1

test_lint_build:
  stage: test_lint_build
  image: python:${PYTHON_VERSION}
  variables:
    # measures the same lines as coverage's default core, at almost none of its cost
    COVERAGE_CORE: sysmon
  script:
    # ``ffmpeg``/``libsm6``/``libxext6`` are kept
    # because ``quantify-scheduler`` pulls them in transitively for
    # plotting backends.
    - apt-get update
    - apt-get install ffmpeg libsm6 libxext6 -y
    - pip install uv==0.11.26
    - uv sync --locked --all-groups
    # print the status of the code
    - echo "CODE_STATUS=${CODE_STATUS}"
    - uv run --locked black --check tergite_tuner dev conftest.py
    - uv run --locked python -m dev.lint.baseline ruff
    - uv run --locked python -m dev.lint.baseline pylint
    - uv run --locked python -m dev.lint.baseline vulture
    # includes test_styleguide.py
    - uv run --locked pytest tergite_tuner -n 4 --cov=tergite_tuner --cov-report xml --cov-report term-missing --junitxml=report.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    key: "uv-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/uv
      - .venv

# Performance: about 15 minutes, so on main and tags, and by hand on a merge request. It
# reports without failing until the CI runner's noise is known (REFACTOR.md step 3.4).
performance:
  stage: test_lint_build
  image: python:${PYTHON_VERSION}
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - when: manual
  script:
    - apt-get update
    - apt-get install ffmpeg libsm6 libxext6 -y
    - pip install uv==0.11.26
    - uv sync --locked --all-groups
    - dev/perf/record.sh perf-recording
    - if [ -d dev/perf/baselines/ci ]; then uv run --locked python -m dev.perf.compare dev/perf/baselines/ci perf-recording; fi
  artifacts:
    when: always
    paths:
      - perf-recording/
  cache:
    key: "uv-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/uv
      - .venv
