stages:
  - test_lint_build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"
  FF_NETWORK_PER_BUILD: 1

test_lint_build:
  stage: test_lint_build
  image: python:${PYTHON_VERSION}
  script:
    # The test suite uses fakeredis, so we don't install / run a real
    # redis server here. ``ffmpeg``/``libsm6``/``libxext6`` are kept
    # because ``quantify-scheduler`` pulls them in transitively for
    # plotting backends.
    - apt-get update
    - apt-get install ffmpeg libsm6 libxext6 -y
    - pip install --upgrade pip
    # Install test dependencies
    - pip install --group test --group dev .
    # print the status of the code
    - echo "CODE_STATUS=${CODE_STATUS}"
    # Run tests
    - pytest tergite_tuner --cov=tergite_tuner --cov-report xml --cov-report term-missing --junitxml=report.xml
    # Run formatter
    - black --check tergite_tuner
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    - key: "default"
      paths:
        - .cache/pip
