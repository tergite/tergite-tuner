stages:
  - test_lint_build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"
  REDIS_URL: "redis://127.0.0.1:6378/1"
  FF_NETWORK_PER_BUILD: 1

test_lint_build:
  stage: test_lint_build
  image: python:${PYTHON_VERSION}
  script:
    # Install dependencies
    - apt-get update
    - apt-get install redis ffmpeg libsm6 libxext6 -y
    # Run Redis server
    - redis-server --daemonize yes --port 6378
    - pip install --upgrade pip
    # Install test dependencies
    - pip install ".[test,dev]"
    # Run tests
    - pytest tergite_autocalibration --cov=tergite_autocalibration --cov-report xml --cov-report term-missing --junitxml=report.xml
    # Run formatter
    - black --check tergite_autocalibration
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    - key: "default"
      paths:
        - .cache/pip
