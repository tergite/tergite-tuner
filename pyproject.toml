[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tergite-tuner"
version = "2026.10.0-rc.2"
description = "Library to tune up the WACQT quantum computers"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [
    { name = "Eleftherios Moschandreou", email = "elemos@chalmers.se" },
    { name = "Liangyu Chen", email = "liangyuc@chalmers.se" },
    { name = "Stefan Hill", email = "stefanhi@chalmers.se" },
    { name = "Amr Osman", email = "oarm@chalmers.se" },
    { name = "Tong Liu", email = "liuto@chalmers.se" },
    { name = "Joel Sandås", email = "sandas@chalmers.se" },
    { name = "Pontus Vikstål", email = "pontus.vikstal@chalmersnextlabs.se" },
    { name = "Michele Faucci Giannelli", email = "faucci@chalmers.se" },
    { name = "Axel Erik Andersson", email = "axean@chalmers.se" },
    { name = "Martin Ahindura", email = "ahindura@chalmers.se"},
    { name = "Adilet Tuleuov", email = "adilet@chalmers.se"},
]
maintainers = [
    { name = "Chalmers Next Labs AB", email = "contact@quantum.chalmersnextlabs.se" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "qblox-instruments~=0.14.2",
    "qcodes~=0.49.0",
    "quantify-scheduler~=0.22.2",
    "scikit-learn~=1.5.2",
    "netcdf4~=1.7.1.post2",
    "tomlkit>=0.13.2",
    "matplotlib>=3.9.3",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "xarray>=2024.11.0",
    "pydantic~=2.11.3",
    "pydantic-settings~=2.9.1",
    "networkx~=3.4.2",
    # imported directly, not only through quantify-scheduler
    "cf-xarray>=0.10.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    # Exact pins: the lint baselines in dev/lint/ are only stable against one version
    "pylint==4.1.3",
    "ruff==0.15.1",
    "vulture==2.16",
]
test = [
    "pytest>=8.3.3",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.6",
]

[project.urls]
Homepage = "https://github.com/tergite/tergite-tuner"
Repository = "https://github.com/tergite/tergite-tuner"
Documentation = "https://github.com/tergite/tergite-tuner"
Issues = "https://github.com/tergite/tergite-tuner/issues"
Changelog = "https://github.com/tergite/tergite-tuner/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["tergite_tuner*"]
exclude = ["*.tests", "*.tests.*", "examples*", "*.data", "*.data.*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I", "E", "W", "B", "UP", "SIM", "C4", "RET", "ARG", "T20"]
# black wraps the code; the lines it cannot wrap are long strings
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# the command-line tools print their results
"dev/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["tergite_tuner"]

[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code", "too-many-statements", "too-many-branches", "too-many-locals"]

[tool.pylint.design]
max-statements = 50

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-imports = true
ignore-comments = true
ignore-docstrings = true
[tool.vulture]
# Called by name from pytest and pydantic, not from our code
ignore_decorators = ["@pytest.fixture", "@*_validator", "@computed_field"]
# Tests take fixtures by name and never use some of them
exclude = ["*/tests/*", "conftest.py"]

[tool.pytest.ini_options]
# dev/perf holds the benchmarks, which dev/perf/record.sh runs
testpaths = ["tergite_tuner"]
markers = ["slow: runs the hardware path end to end; deselect with -m 'not slow'"]
